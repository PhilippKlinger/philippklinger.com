# Deploys the static build via FTPS to All-Inkl (spec 3.5).
# main is protected by required checks, so every push here passed them in its pull request.
# Upload with lftp from the Ubuntu archive instead of a third-party action:
# no foreign code ever sees the FTP credentials.
# The production job ships the exact files the preview job built and tested,
# and only after a required reviewer approved the environment.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two uploads into the same folder at once. Per job, so a production
    # run waiting for approval does not hold back later preview deploys.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    # Job-level grants replace the workflow default, so contents: read is repeated.
    # id-token signs the attestation via Sigstore, attestations stores it on the repo.
    # Only this job builds, so production and its FTP secrets never hold these rights.
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: preview
      url: https://preview.philipp-klinger.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Prerendered pages then carry a real state, also without JavaScript. Failing is not fatal:
      # the pages then read "not available" until the browser has loaded /status.json.
      - name: Collect status for the prerender
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-status.mjs status-snapshot.json

      # Footer line: which commit and which run built this page. Prerender only.
      - name: Write build info
        run: |
          set -Eeuo pipefail
          jq -nc --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" \
            '{sha: $sha, runId: $runId}' > build-info.json

      - name: Build static site
        run: npm run build

      # What is live, for the status collector. Part of the artifact, so production
      # reports the commit of exactly the build it received.
      - name: Write version file
        run: |
          set -Eeuo pipefail
          jq -nc --arg sha "$GITHUB_SHA" --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, builtAt: $builtAt}' > dist/philippklinger/browser/version.json

      - name: Check build output before upload
        working-directory: dist/philippklinger/browser
        run: |
          set -Eeuo pipefail
          test -f .htaccess || { echo "::error::.htaccess missing in the build"; exit 1; }
          test -f 404/index.html || { echo "::error::404 page missing in the build"; exit 1; }
          if grep -rlF 'platzhalter.invalid' .; then
            echo "::error::Placeholder links must never go live."
            exit 1
          fi

      # Lets anyone check a downloaded live file against this repository with
      # gh attestation verify. Production ships these same files, so one attestation
      # covers both hosts. index.csr.html is excluded because it is never uploaded.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/philippklinger/browser/**
            !dist/philippklinger/browser/index.csr.html

      # The transparency log is a single outside dependency: a short outage must not stop a deploy.
      # The second attempt has no continue-on-error, so nothing ships unattested.
      - name: Wait before the second attestation attempt
        if: steps.attest.outcome == 'failure'
        run: sleep 60

      - name: Attest build provenance (second attempt)
        if: steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/philippklinger/browser/**
            !dist/philippklinger/browser/index.csr.html

      # .htaccess is a hidden file and would be skipped by default.
      - name: Keep build for production
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/philippklinger/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # The FTP user only sees the preview folder, so "." is its root.
      # --delete removes files of older builds; .well-known holds the
      # Let's Encrypt challenges of the host and is left alone, like status.json,
      # which is not part of the build but comes from the status workflow.
      - name: Upload via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob index.csr.html \
              --exclude '^\.well-known/' \
              --exclude '^status\.json$' \
              dist/philippklinger/browser/ .
          "

      # Readiness: the host answers with the rules of the new .htaccess.
      - name: Smoke test preview
        env:
          SITE: https://preview.philipp-klinger.com
        run: |
          set -Eeuo pipefail
          check() { grep -qiE "$3" <<<"$2" || { echo "::error::$1"; echo "$2"; exit 1; }; }
          home=$(curl -sSI --retry 3 --retry-delay 5 "$SITE/")
          check "start page not 200" "$home" '^HTTP/[0-9.]+ 200'
          check "CSP missing" "$home" "^content-security-policy: default-src 'self'"
          check "HSTS missing" "$home" '^strict-transport-security:.*includesubdomains'
          check "preview is indexable" "$home" '^x-robots-tag: noindex'
          check "no gzip" "$(curl -sSI -H 'Accept-Encoding: gzip' "$SITE/")" '^content-encoding: gzip'
          check "/imprint not redirected" "$(curl -sSI "$SITE/imprint")" '^location: .*/impressum/'
          check "/projekte not redirected" "$(curl -sSI "$SITE/projekte")" '^location: .*/#projekte'
          check "/projekte/ not redirected" "$(curl -sSI "$SITE/projekte/")" '^location: .*/#projekte'
          check "project page not 200" "$(curl -sSI "$SITE/projekte/videoflix/")" '^HTTP/[0-9.]+ 200'
          check "site page not 200" "$(curl -sSI "$SITE/projekte/portfolio/")" '^HTTP/[0-9.]+ 200'
          check "unknown path not 404" "$(curl -sSI "$SITE/gibt-es-nicht/")" '^HTTP/[0-9.]+ 404'
          check "footer does not name this run" "$(curl -sS "$SITE/")" "actions/runs/${GITHUB_RUN_ID}"
          echo "Preview answers as expected."

  production:
    name: Deploy production
    needs: preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      url: https://philipp-klinger.com
    steps:
      # CI runs next to this workflow, not before it. A red or cancelled run after the merge must
      # stop production, whoever approves. Only a completed green run of this commit counts.
      - name: Require green checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for workflow in ci.yml codeql.yml; do
            conclusion=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "missing"')
            if [ "$conclusion" != "success" ]; then
              echo "::error::$workflow for this commit is $conclusion, not success."
              exit 1
            fi
          done

      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Same rules as the preview upload. This FTP user must only see the
      # production folder: --delete removes everything else it can reach. A marker
      # file, placed once by hand in that folder, proves the user stands where it
      # should; without it nothing is uploaded or deleted.
      - name: Upload via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if ! lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            get .deploy-target-production -o \"$RUNNER_TEMP/deploy-target-production\"
          "; then
            echo "::error::Could not read the marker .deploy-target-production in the FTP root (missing marker, wrong user or no connection). Nothing was uploaded or deleted."
            exit 1
          fi
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob index.csr.html \
              --exclude-glob '.deploy-target-*' \
              --exclude '^\.well-known/' \
              --exclude '^status\.json$' \
              site/ .
          "

      - name: Smoke test production
        env:
          SITE: https://philipp-klinger.com
        run: |
          set -Eeuo pipefail
          check() { grep -qiE "$3" <<<"$2" || { echo "::error::$1"; echo "$2"; exit 1; }; }
          home=$(curl -sSI --retry 3 --retry-delay 5 "$SITE/")
          check "start page not 200" "$home" '^HTTP/[0-9.]+ 200'
          check "CSP missing" "$home" "^content-security-policy: default-src 'self'"
          check "HSTS missing" "$home" '^strict-transport-security:.*includesubdomains'
          if grep -qi '^x-robots-tag:' <<<"$home"; then
            echo "::error::production must stay indexable"
            exit 1
          fi
          check "no gzip" "$(curl -sSI -H 'Accept-Encoding: gzip' "$SITE/")" '^content-encoding: gzip'
          check "/imprint not redirected" "$(curl -sSI "$SITE/imprint")" '^location: .*/impressum/'
          check "/projekte not redirected" "$(curl -sSI "$SITE/projekte")" '^location: .*/#projekte'
          check "/projekte/ not redirected" "$(curl -sSI "$SITE/projekte/")" '^location: .*/#projekte'
          check "project page not 200" "$(curl -sSI "$SITE/projekte/videoflix/")" '^HTTP/[0-9.]+ 200'
          check "site page not 200" "$(curl -sSI "$SITE/projekte/portfolio/")" '^HTTP/[0-9.]+ 200'
          check "unknown path not 404" "$(curl -sSI "$SITE/gibt-es-nicht/")" '^HTTP/[0-9.]+ 404'
          check "www not redirected" "$(curl -sSI https://www.philipp-klinger.com/)" '^location: https://philipp-klinger\.com/'
          check "http not redirected" "$(curl -sSI http://philipp-klinger.com/)" '^location: https://philipp-klinger\.com/'
          check "robots.txt missing" "$(curl -sSI "$SITE/robots.txt")" '^HTTP/[0-9.]+ 200'
          check "sitemap missing" "$(curl -sSI "$SITE/sitemap.xml")" '^HTTP/[0-9.]+ 200'
          # F-24: the cards read this file; Status uploads it, the mirror never deletes it.
          curl -fsS --max-time 20 "$SITE/status.json" | jq -e '.schemaVersion == 1' > /dev/null \
            || { echo "::error::status.json missing or not readable"; exit 1; }
          echo "Production answers as expected."
