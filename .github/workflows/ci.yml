# Quality gates of stage 1 (spec section 4). Based on the docker-cicd template,
# without the image and deploy jobs: the site is static and deployed via FTPS later.
# Actions are pinned by commit SHA; update the SHAs together with their version comments.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check end-to-end tests
        run: npx tsc -p tsconfig.e2e.json

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build static site
        run: npm run build

      # Angular budgets measure raw sizes; the spec limits the compressed start bundle.
      - name: Check start bundle size (max 150 kB gzip)
        working-directory: dist/philippklinger/browser
        run: |
          set -Eeuo pipefail
          size=$(cat main-*.js polyfills-*.js styles-*.css | gzip -9 | wc -c)
          echo "Start bundle: ${size} bytes gzip"
          test "${size}" -le 153600

      # Missing links point to https://platzhalter.invalid/... and must never go live.
      - name: Check for placeholder links
        run: |
          set -Eeuo pipefail
          if grep -rlF 'platzhalter.invalid' dist/philippklinger/browser; then
            echo "::error::Placeholder links found in the build output (files listed above)."
            exit 1
          fi

      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Create SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  # Separate from "quality" on purpose: a red placeholder check must not hide
  # the browser findings, so this job builds the site itself.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Site-wide checks, axe (WCAG 2.2 AA) and screenshots in 4 viewports.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload summary and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Thresholds in lighthouserc.json (spec 4). Reports stay in the run's
      # artifacts; temporary public storage is off on purpose.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No license needed for repositories of a personal account.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
