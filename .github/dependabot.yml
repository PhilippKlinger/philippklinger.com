version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      dev-tools:
        dependency-type: development
        exclude-patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']

  # Keeps the SHA-pinned actions up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
