<div class="page legal">
  <h1 i18n>Impressum</h1>

  <section>
    <h2>{{ imprint.providerHeading }}</h2>
    <p>
      @for (line of address; track line) {
        {{ line }}<br />
      }
    </p>
  </section>

  <section>
    <h2>{{ imprint.contactHeading }}</h2>
    <p>
      E-Mail: <a [href]="'mailto:' + email">{{ email }}</a>
    </p>
  </section>
</div>
