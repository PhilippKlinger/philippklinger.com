<!-- Hidden with visibility, so it is out of the tab order while the hero is in view or the page scrolls. -->
<button
  type="button"
  class="back-to-top"
  [class.shown]="shown()"
  i18n-aria-label
  aria-label="Nach oben"
  (click)="backToTop()"
>
  <svg aria-hidden="true" viewBox="0 0 24 24">
    <path d="M12 19V5M5 12l7-7 7 7" />
  </svg>
</button>
