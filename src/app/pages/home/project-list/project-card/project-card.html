<article class="card" appCardLink>
  <div class="card-main">
    <div class="signal">
      <app-state-badge [state]="view().signal.state" [label]="view().signal.status" />
      @if (view().signal.when; as when) {
        <span class="signal-when">{{ when }}</span>
      }
    </div>
    <h3>{{ project().title }}</h3>
    <p>{{ project().summary }}</p>
    <ul class="chips" i18n-aria-label aria-label="Technik">
      @for (chip of project().chips; track chip) {
        <li>{{ chip }}</li>
      }
    </ul>
    <div class="actions">
      <!-- Trailing slash: canonical URL on Apache, no 301. -->
      <a
        class="cta"
        data-card-cta
        data-cursor="Projekt ansehen"
        [href]="'/projekte/' + project().slug + '/'"
        [attr.aria-label]="ctaLabel + ': ' + project().title"
        >{{ ctaLabel }}</a
      >
      @for (link of project().links; track link.url) {
        <a class="cta-quiet" [href]="link.url">{{ link.label }}</a>
      }
    </div>
  </div>
  <app-delivery-flow [view]="view()" />
</article>
