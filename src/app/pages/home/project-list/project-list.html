<section id="projekte" class="section" tabindex="-1" aria-labelledby="projects-title">
  <h2 id="projects-title" i18n>Projekte</h2>
  <p class="notice" role="status">{{ status.notice() }}</p>

  <div #list class="list">
    <ul class="rows">
      @for (row of rows(); track row.slug) {
        <li><app-project-row [row]="row" /></li>
      }
    </ul>
    <app-row-preview />
  </div>
</section>
