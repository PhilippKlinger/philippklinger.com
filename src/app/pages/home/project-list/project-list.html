<section id="projekte" class="section" aria-labelledby="projects-title">
  <p class="eyebrow" i18n>Portfolio</p>
  <h2 id="projects-title" i18n>Projekte</h2>
  <p class="notice" role="status">{{ status.notice() }}</p>

  <ul class="cards">
    @for (project of projects; track project.slug) {
      <li><app-project-card [project]="project" /></li>
    }
    <li><app-report-card /></li>
  </ul>
</section>
