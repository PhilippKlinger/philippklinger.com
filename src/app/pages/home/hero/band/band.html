<!-- Read once; the moving copies below are decoration (PK-21). -->
<ul class="visually-hidden">
  @for (item of availability; track item) {
    <li>{{ item }}</li>
  }
</ul>
<div class="band-track" aria-hidden="true">
  @for (copy of copies; track copy) {
    <ul class="band-items">
      @for (item of availability; track item) {
        <li>{{ item }}</li>
      }
    </ul>
  }
</div>
<button
  type="button"
  class="band-pause"
  [attr.aria-pressed]="paused()"
  (click)="togglePause()"
  i18n-aria-label
  aria-label="Laufband anhalten"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    @if (paused()) {
      <path d="M8 5v14l11-7z" />
    } @else {
      <path d="M7 5h3v14H7zm7 0h3v14h-3z" />
    }
  </svg>
</button>
