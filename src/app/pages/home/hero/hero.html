<section class="hero" aria-labelledby="hero-title">
  <div class="intro">
    <p class="role">
      @for (part of roleParts; track part) {
        @if (!$first) {
          <span class="role-dot"> · </span>
        }
        <span>{{ part }}</span>
      }
    </p>
    <h1 id="hero-title" class="name">{{ profile.name }}</h1>
    <p class="claim">{{ profile.claim }}</p>
    <div class="actions">
      <a class="button button-primary" routerLink="/" fragment="projekte" i18n>Projekte ansehen</a>
      <a class="button" routerLink="/" fragment="kontakt" i18n>Kontakt</a>
    </div>
  </div>

  <app-hero-pipeline />
</section>
