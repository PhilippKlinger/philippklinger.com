<section id="ueber-mich" class="section about" aria-labelledby="about-title">
  <img
    class="portrait"
    src="images/portrait.webp"
    width="800"
    height="800"
    loading="lazy"
    i18n-alt
    alt="Porträt von Philipp Klinger"
  />

  <div>
    <p class="eyebrow" i18n>Wer ich bin</p>
    <div class="card">
      <h2 id="about-title" i18n>Über mich</h2>
      <p class="intro">{{ about.intro }}</p>
      <ul class="points">
        @for (point of about.points; track point) {
          <li>{{ point }}</li>
        }
      </ul>
    </div>
  </div>
</section>
