<section id="ueber-mich" class="section about" tabindex="-1" aria-labelledby="about-title">
  <div class="portrait-media">
    <img
      class="portrait"
      src="images/portrait.webp"
      width="800"
      height="800"
      loading="lazy"
      i18n-alt
      alt="Porträt von Philipp Klinger"
    />
  </div>

  <div class="body">
    <h2 id="about-title" i18n>Über mich</h2>
    <!-- DRAFT -->
    <p class="motto">{{ about.motto }}</p>
    <!-- Prerendered fully drawn; after hydration the line only waits when it is still below. -->
    <div #path class="path" [attr.data-line]="line()">
      <span class="track" aria-hidden="true"></span>
      <span class="fill" aria-hidden="true"></span>
      <ol class="stops" i18n-aria-label aria-label="Werdegang">
        @for (station of about.path; track station) {
          <li>
            <span class="node" aria-hidden="true"></span>
            <span class="name">{{ station }}</span>
          </li>
        }
      </ol>
    </div>
    <!-- DRAFT -->
    <p class="text">{{ about.text }}</p>
  </div>
</section>
