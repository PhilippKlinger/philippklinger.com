<section id="skills" class="section" tabindex="-1" aria-labelledby="focus-title">
  <h2 id="focus-title" i18n>Skills</h2>

  <ul class="areas">
    @for (area of focusAreas; track area.title) {
      <li class="card">
        <h3>{{ area.title }}</h3>
        <p class="description">{{ area.description }}</p>
        <ul class="tools">
          @for (tool of area.tools; track tool) {
            <li>
              <!-- Decorative: the visible name is the accessible text. -->
              <svg aria-hidden="true">
                <use [attr.href]="'/images/tools.svg#' + toolIcons[tool]" />
              </svg>
              {{ tool }}
            </li>
          }
        </ul>
      </li>
    }
  </ul>
</section>
