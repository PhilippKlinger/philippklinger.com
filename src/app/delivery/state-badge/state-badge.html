<span class="state" [class]="'state-' + state()">
  <svg viewBox="0 0 16 16" aria-hidden="true">
    @switch (state()) {
      @case ('verified') {
        <circle cx="8" cy="8" r="7" fill="currentColor" />
        <path class="check" d="M4.5 8.2 7 10.6l4.6-5" fill="none" stroke-width="1.8" />
      }
      @case ('partial') {
        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor" />
      }
      @case ('deviation') {
        <path
          d="M8 2 14.8 14H1.2z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path d="M8 6.2v3.9" fill="none" stroke="currentColor" stroke-width="1.6" />
        <circle cx="8" cy="12" r="0.9" fill="currentColor" />
      }
      @case ('unavailable') {
        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path
          d="M6.2 6.3a1.8 1.8 0 1 1 2.8 1.5c-.7.5-1 .8-1 1.6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
        />
        <circle cx="8" cy="11.6" r="0.85" fill="currentColor" />
      }
      @case ('notSetUp') {
        <circle
          cx="8"
          cy="8"
          r="6.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-dasharray="2.4 2.4"
        />
      }
      @case ('private') {
        <rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor" />
        <path
          d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
      }
    }
  </svg>
  {{ labels[state()] }}
</span>
