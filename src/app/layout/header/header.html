<header class="header">
  <!-- The accessible name starts with the visible text "PK" (WCAG 2.5.3). -->
  <a class="logo" routerLink="/" i18n-aria-label aria-label="PK, Philipp Klinger, zur Startseite">
    <!-- &ngsp; keeps the spaces Angular would strip, so the visible text reads "PK Philipp Klinger". -->
    <span class="logo-mark" aria-hidden="true">PK</span>&ngsp;<span
      class="logo-name"
      aria-hidden="true"
      ><span>Philipp</span>&ngsp;<span>Klinger</span></span
    >
  </a>

  <button
    #menuButton
    class="menu-button"
    type="button"
    aria-controls="main-nav"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span class="visually-hidden" i18n>Menü</span>
    <span class="menu-icon" aria-hidden="true"></span>
  </button>

  <nav
    id="main-nav"
    class="nav"
    [class.open]="menuOpen()"
    i18n-aria-label
    aria-label="Hauptnavigation"
  >
    <ul>
      @for (item of navigation; track item.fragment) {
        <li>
          <a routerLink="/" [fragment]="item.fragment" (click)="closeMenu()">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>
</header>
